<!--
  client/src/index.html — Root HTML Shell

  The single HTML page served by the Angular dev server and bundled into the
  production build. Angular injects the compiled JS/CSS bundles into this file
  at build time via the angular.json index configuration.

  <app-root> is the mount point for AppComponent. Angular replaces this element
  with the rendered component tree at runtime.

  The <base href="/"> tag is required by Angular's router to correctly resolve
  relative asset and navigation paths.
-->
<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>CampusNavigator</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0">
  <link rel="icon" type="image/x-icon" href="favicon.ico">
</head>
<body>
  <app-root></app-root>
</body>
</html>
